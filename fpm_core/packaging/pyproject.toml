[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpm"
version = "0.1.0"
description = "Fastest Image Pattern Matching — prebuilt C++ core for Python (Windows x64), OpenCV DLLs bundled"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["pillow"]

[project.scripts]
fpm-gui = "fpm.gui:main"

[tool.setuptools]
packages = ["fpm"]

[tool.setuptools.package-data]
# Ship the prebuilt extension and the OpenCV runtime DLLs inside the wheel.
fpm = ["*.pyd", "_libs/*.dll"]
